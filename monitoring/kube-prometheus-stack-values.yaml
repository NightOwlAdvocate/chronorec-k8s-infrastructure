grafana:
  defaultDashboardsEnabled: true
  # Grafana 13 performs a long first-start plugin scan on a small local kind
  # node. The upstream probe window can restart it before that scan completes.
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 300
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 12
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  enabled: false
