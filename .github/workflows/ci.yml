name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement app/requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest

  kubernetes:
    name: Build and deploy to kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - name: Lint Helm chart
        run: helm lint helm/chronorec-demo
      - name: Render default and monitoring manifests
        run: |
          helm template chronorec-demo helm/chronorec-demo --namespace chronorec-lab >/tmp/default.yaml
          helm template chronorec-demo helm/chronorec-demo --namespace chronorec-lab --values helm/chronorec-demo/values-monitoring.yaml >/tmp/monitoring.yaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: chronorec-lab
          config: kind/cluster.yaml
          version: v0.33.0
      - name: Build and load image
        run: |
          docker build --tag chronorec-demo-api:dev app
          kind load docker-image chronorec-demo-api:dev --name chronorec-lab
      - name: Deploy chart
        run: helm upgrade --install chronorec-demo helm/chronorec-demo --namespace chronorec-lab --create-namespace --wait --timeout 3m
      - name: Verify Kubernetes resources
        run: ./scripts/verify-deployment.sh
