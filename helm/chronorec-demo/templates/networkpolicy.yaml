{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chronorec-demo.fullname" . }}
  labels:
    {{- include "chronorec-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chronorec-demo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
